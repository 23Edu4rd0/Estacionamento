<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Estacionamento · Escala de Trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">P</span>
    <strong>Escala de Trabalho</strong>
  </div>
  <button id="admin-toggle-btn" class="link-btn">Admin</button>
</header>

<div id="admin-panel" class="admin-panel" hidden>
  <form id="login-form" class="admin-login" hidden>
    <input type="email" id="login-email" placeholder="E-mail" required autocomplete="username" />
    <input type="password" id="login-password" placeholder="Senha" required autocomplete="current-password" />
    <button type="submit">Entrar</button>
    <p id="login-error" class="error-msg" hidden></p>
  </form>

  <div id="admin-tools" class="admin-tools" hidden>
    <span class="admin-badge">Modo admin</span>
    <button type="button" class="link-btn" data-open="new-designation">Nova designação</button>
    <button type="button" class="link-btn" data-open="workers">Trabalhadores</button>
    <button type="button" class="link-btn" data-open="sectors">Setores</button>
    <button type="button" id="logout-btn" class="link-btn">Sair</button>
  </div>
</div>

<main>
  <div class="date-bar">
    <label class="date-field">
      <span>Dia</span>
      <input type="date" id="date-picker" />
    </label>
    <div class="clock" id="clock">--:--</div>
  </div>

  <section class="shift-section">
    <h2><span class="dot dot-now"></span> Agora</h2>
    <ul id="current-list" class="worker-list"></ul>
    <p id="current-empty" class="empty-hint" hidden>Ninguém escalado neste horário.</p>
  </section>

  <section class="shift-section">
    <h2><span class="dot dot-next"></span> Próximos</h2>
    <ul id="next-list" class="worker-list"></ul>
    <p id="next-empty" class="empty-hint" hidden>Nenhuma próxima designação hoje.</p>
  </section>
</main>

<div class="drawer-backdrop" id="drawer-backdrop" hidden>
  <div class="drawer">
    <div class="drawer-head">
      <h3 id="drawer-title">Trabalhadores</h3>
      <button type="button" class="link-btn" id="drawer-close">Fechar</button>
    </div>

    <div id="drawer-workers" class="drawer-section" hidden>
      <form id="worker-form" class="inline-form">
        <input type="text" id="worker-name" placeholder="Nome" required />
        <input type="text" id="worker-phone" placeholder="Telefone" />
        <input type="text" id="worker-congregation" placeholder="Congregação" required />
        <button type="submit">Adicionar</button>
      </form>
      <p id="worker-msg" class="msg" hidden></p>
      <ul id="workers-list" class="simple-list"></ul>
    </div>

    <div id="drawer-sectors" class="drawer-section" hidden>
      <form id="sector-form" class="inline-form">
        <input type="text" id="sector-name" placeholder="Nome do setor" required />
        <button type="submit">Adicionar</button>
      </form>
      <p id="sector-msg" class="msg" hidden></p>
      <ul id="sectors-list" class="simple-list"></ul>
    </div>

    <div id="drawer-new-designation" class="drawer-section" hidden>
      <form id="designation-form" class="inline-form stacked">
        <select id="worker-select" required>
          <option value="" disabled selected>Trabalhador</option>
        </select>
        <select id="sector-select">
          <option value="">Sem setor</option>
        </select>
        <div class="field-row">
          <input type="time" id="shift-start" required />
          <input type="time" id="shift-end" required />
        </div>
        <input type="date" id="event-date" required />
        <button type="submit">Salvar designação</button>
      </form>
      <p id="designation-msg" class="msg" hidden></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
