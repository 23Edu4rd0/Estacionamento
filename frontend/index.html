<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escala de Trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">E</span>
      <span class="brand-name">Escala de Trabalho</span>
    </div>
    <button type="button" id="admin-btn" class="btn btn-ghost">Admin</button>
  </div>
</header>

<!-- Barra de admin: escondida por padrão, só aparece ao clicar em "Admin" -->
<div class="adminbar is-hidden" id="adminbar">
  <div class="adminbar-inner">
    <form class="login-row" id="login-form">
      <input type="email" id="login-email" placeholder="E-mail" autocomplete="username" required />
      <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password" required />
      <button type="submit" class="btn btn-primary">Entrar</button>
      <button type="button" class="btn btn-ghost" id="login-cancel">Cancelar</button>
      <p class="feedback is-hidden" id="login-feedback"></p>
    </form>

    <div class="admin-row is-hidden" id="admin-row">
      <span class="chip chip-admin">Modo admin</span>
      <div class="admin-row-actions">
        <button type="button" class="btn btn-ghost" data-panel="designation">+ Designação</button>
        <button type="button" class="btn btn-ghost" data-panel="workers">Trabalhadores</button>
        <button type="button" class="btn btn-ghost" data-panel="sectors">Setores</button>
        <button type="button" class="btn btn-ghost" id="logout-btn">Sair</button>
      </div>
    </div>
  </div>
</div>

<main class="main">

  <section class="overview">
    <div class="overview-date">
      <label for="date-picker">Dia</label>
      <input type="date" id="date-picker" />
      <p class="overview-weekday" id="weekday-label"></p>
    </div>
    <div class="overview-clock">
      <span class="overview-clock-label">Agora</span>
      <span class="overview-clock-value" id="clock">--:--</span>
    </div>
  </section>

  <!-- Painéis de admin: fechados por padrão -->
  <section class="panel is-hidden" id="panel-designation">
    <h2 class="panel-title">Nova designação</h2>
    <form id="designation-form" class="form-grid">
      <label class="field">
        <span>Trabalhador</span>
        <select id="designation-worker" required>
          <option value="" disabled selected>Selecione</option>
        </select>
      </label>
      <label class="field">
        <span>Setor</span>
        <select id="designation-sector">
          <option value="">Sem setor</option>
        </select>
      </label>
      <label class="field">
        <span>Data</span>
        <input type="date" id="designation-date" required />
      </label>
      <label class="field">
        <span>Início</span>
        <input type="time" id="designation-start" required />
      </label>
      <label class="field">
        <span>Fim</span>
        <input type="time" id="designation-end" required />
      </label>
      <div class="field field-submit">
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
      <p class="feedback is-hidden" id="designation-feedback"></p>
    </form>
  </section>

  <section class="panel is-hidden" id="panel-workers">
    <h2 class="panel-title">Trabalhadores</h2>
    <form id="worker-form" class="form-inline">
      <input type="text" id="worker-name" placeholder="Nome" required />
      <input type="text" id="worker-phone" placeholder="Telefone" />
      <input type="text" id="worker-congregation" placeholder="Congregação" required />
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>
    <p class="feedback is-hidden" id="worker-feedback"></p>
    <ul class="list" id="workers-list"></ul>
  </section>

  <section class="panel is-hidden" id="panel-sectors">
    <h2 class="panel-title">Setores</h2>
    <form id="sector-form" class="form-inline">
      <input type="text" id="sector-name" placeholder="Nome do setor" required />
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>
    <p class="feedback is-hidden" id="sector-feedback"></p>
    <ul class="list" id="sectors-list"></ul>
  </section>

  <section class="shift">
    <h2 class="shift-title"><span class="pulse"></span> Trabalhando agora</h2>
    <ul class="cards" id="current-list"></ul>
    <p class="empty is-hidden" id="current-empty">Ninguém escalado neste horário.</p>
  </section>

  <section class="shift">
    <h2 class="shift-title shift-title-muted">Próximos</h2>
    <ul class="cards" id="next-list"></ul>
    <p class="empty is-hidden" id="next-empty">Nenhuma designação a seguir.</p>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
